[project]
name = "llm-code-tutor-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "cryptography>=44",
    # --- P1 RAG 知识库批次引入 ---
    "chromadb>=0.5",  # P1：向量库本地持久化
    "pdfplumber>=0.11",  # P1：PDF 文档解析
    "python-docx>=1.1",  # P1：DOCX 文档解析
    # --- P4 在线编辑器与受限执行器批次引入 ---
    # ADR-0003：内存上限靠 psutil 轮询采样子进程 RSS，不能靠 RLIMIT_AS/DATA/RSS
    #（macOS 下这三项 setrlimit 一律抛 ValueError: current limit exceeds maximum limit）
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]
local-embed = ["sentence-transformers>=3.0", "torch>=2.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
# seeds 是顶层包（spec §4.3：backend/seeds/ = 习题种子 + 初始 admin，遗留 M2）
packages = ["app", "seeds"]

[tool.setuptools.package-dir]
app = "app"
seeds = "seeds"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
